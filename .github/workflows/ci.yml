name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Boundary Gate
        run: bun run gate:v2

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test
